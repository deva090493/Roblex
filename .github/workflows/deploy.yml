name: Deploy to Render
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'README.md', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK secret is missing"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
