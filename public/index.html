<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BlockVerse</title>
<style>
  :root { --accent:#ffb400; --bg:#101522; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,sans-serif; color:#fff; touch-action:none; }
  canvas { display:block; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(160deg,#1b2a4a,#3a1c5c); z-index:20; padding:16px; }
  #start h1 { margin:0; font-size:44px; letter-spacing:2px; text-shadow:0 4px 0 #000; }
  #start input { padding:12px 14px; font-size:18px; border-radius:10px; border:none; width:240px; }
  .colors { display:flex; gap:8px; }
  .colors button { width:36px; height:36px; border-radius:8px; border:3px solid transparent; cursor:pointer; }
  .colors button.sel { border-color:#fff; }
  .btn { background:var(--accent); color:#111; font-weight:800; border:none; border-radius:12px; padding:12px 26px; font-size:18px; cursor:pointer; box-shadow:0 4px 0 #a06f00; }
  #hud { position:fixed; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; }
  .pill { background:rgba(0,0,0,.55); padding:6px 12px; border-radius:20px; font-weight:700; font-size:14px; pointer-events:auto; }
  #hubBtn { display:none; border:none; color:#fff; cursor:pointer; }
  #toast { position:fixed; top:56px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:8px 16px; border-radius:20px;
    font-weight:700; opacity:0; transition:opacity .3s; z-index:6; text-align:center; max-width:90vw; }
  #chatLog { position:fixed; left:10px; bottom:180px; width:min(300px,70vw); font-size:13px; z-index:5; pointer-events:none; }
  #chatLog div { background:rgba(0,0,0,.45); margin-top:3px; padding:3px 8px; border-radius:6px; }
  #chatForm { position:fixed; left:10px; top:92px; z-index:6; display:flex; gap:4px; }
  #chatForm input { width:min(200px,50vw); padding:6px 8px; border-radius:8px; border:none; font-size:14px; }
  #joy { position:fixed; left:24px; bottom:24px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.12); z-index:5; display:none; }
  #knob { position:absolute; left:40px; top:40px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.45); }
  #jumpBtn { position:fixed; right:28px; bottom:40px; width:84px; height:84px; border-radius:50%; background:rgba(255,180,0,.75); border:none;
    font-weight:900; font-size:16px; z-index:5; display:none; color:#111; }
  #floorBar { position:fixed; top:100px; left:50%; transform:translateX(-50%); padding:10px 22px; border-radius:14px; font-weight:900;
    font-size:20px; z-index:6; display:none; text-shadow:0 2px 0 #0006; box-shadow:0 4px 0 #0005; }
  #gamesBtn { background:var(--accent); color:#111; border:none; cursor:pointer; }
  #menu { position:fixed; inset:0; background:rgba(10,14,28,.94); z-index:15; display:none; flex-direction:column; padding:16px; overflow-y:auto; }
  #menu header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  #menu h2 { margin:0; font-size:24px; }
  #menuClose { background:#333; color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:16px; }
  #gameGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .gcard { background:#1d2438; border:none; border-radius:14px; padding:0 0 10px; color:#fff; text-align:left; cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; gap:4px; font-family:inherit; }
  .gcard b { padding:0 10px; font-size:15px; } .gcard small { padding:0 10px; opacity:.7; font-size:12px; line-height:1.3; }
  .gthumb { height:90px; display:flex; align-items:center; justify-content:center; font-size:46px; }
  .gcard:active { transform:scale(.97); }
  #help { position:fixed; bottom:10px; right:10px; font-size:12px; opacity:.7; z-index:5; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="start">
  <h1>BLOCKVERSE</h1>
  <input id="nameIn" maxlength="16" placeholder="உங்க பெயர்">
  <div class="colors" id="colors"></div>
  <button class="btn" id="playBtn">விளையாடு ▶</button>
</div>

<div id="hud">
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="pill" id="roomLabel">🏠 Hub</span>
    <button class="pill" id="gamesBtn">🎮 Games</button>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span class="pill" id="tagInfo" style="display:none"></span>
    <span class="pill">🪙 <span id="coins">0</span></span>
    <button class="pill" id="hubBtn">🏠 Hub</button>
  </div>
</div>
<form id="chatForm"><input id="chatIn" maxlength="120" placeholder="Chat... (Enter)"></form>
<div id="chatLog"></div>
<div id="toast"></div>
<div id="floorBar"></div>
<div id="menu">
  <header><h2>🎮 Games</h2><button id="menuClose">✕</button></header>
  <div id="gameGrid"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">JUMP</button>
<div id="help">WASD/அம்புக்குறி = நகர · Space = குதி · Mouse drag = camera</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
